<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Feedback 2026</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        h1 { text-align: center; color: #333; }
        .controls { margin-bottom: 20px; text-align: center; }
        select { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        .table-container { overflow-x: auto; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { padding: 12px 15px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

    <h1>CRM Feedback 2026 Dashboard</h1>

    <div class="controls">
        <label for="monthSelect"><b>Select Month: </b></label>
        <select id="monthSelect" onchange="loadSheetData()">
            <option value="January">January</option>
            <option value="February">February</option>
            <option value="March">March</option>
            <option value="April">April</option>
            <option value="May">May</option>
            <option value="June">June</option>
            <option value="July">July</option>
            <option value="August">August</option>
            <option value="September">September</option>
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>REG DATE</th>
                    <th>PATIENT ID</th>
                    <th>PATIENT NAME</th>
                    <th>PHN NO.</th>
                    <th>CALL STATUS</th>
                    <th>FEEDBACK</th>
                    <th>CALL TYPE</th>
                    <th>ASSIGNED TO</th>
                    <th>CALL DUE DATE</th>
                    <th>TASK STATUS</th>
                    <th>REMARKS</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <script>
        // Copy cheytha Apps Script Web App URL ivide nalkuka
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwF2Z-ZPDr5vCutpqpKf_sVPTyCdPqEIIrtTWhg6qNH368W9amj1a2qC9bYpNGfHidjyw/exec"; 

        async function loadSheetData() {
            const selectedMonth = document.getElementById("monthSelect").value;
            const tableBody = document.getElementById("tableBody");
            
            tableBody.innerHTML = `<tr><td colspan="11" style="text-align:center;">Loading ${selectedMonth} data...</td></tr>`;

            try {
                const response = await fetch(`${WEB_APP_URL}?sheet=${selectedMonth}`);
                const data = await response.json();

                if (data.error || data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="11" style="text-align:center;">No data found for ${selectedMonth}</td></tr>`;
                    return;
                }

                tableBody.innerHTML = "";
                data.forEach(row => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${row["REG DATE"] || ''}</td>
                        <td>${row["PATIENT ID"] || ''}</td>
                        <td>${row["PATIENT NAME"] || ''}</td>
                        <td>${row["PHN NO."] || ''}</td>
                        <td>${row["CALL STATUS"] || ''}</td>
                        <td>${row["FEEDBACK"] || ''}</td>
                        <td>${row["CALL TYPE"] || ''}</td>
                        <td>${row["ASSIGNED TO"] || ''}</td>
                        <td>${row["CALL DUE DATE"] || ''}</td>
                        <td>${row["TASK STATUS"] || ''}</td>
                        <td>${row["REMARKS"] || ''}</td>
                    `;
                    tableBody.appendChild(tr);
                });

            } catch (error) {
                console.error(error);
                tableBody.innerHTML = `<tr><td colspan="11" style="text-align:center; color:red;">Data fetch cheyyaan sadhichilla. Web App URL sarikkanonnu parisodhikku.</td></tr>`;
            }
        }

        window.onload = loadSheetData;
    </script>

</body>
</html>
