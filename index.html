<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Feedback 2026</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 15px;
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #1a73e8;
        }
        .controls-container {
            background: #ffffff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }
        select, input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            background-color: #f9fafb;
        }
        select:focus, input:focus {
            border-color: #1a73e8;
            background-color: #ffffff;
        }
        
        /* Table Default Style (Desktop View) */
        .table-container {
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #1a73e8;
            color: white;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        /* Mobile View (Card Layout) */
        @media screen and (max-width: 768px) {
            table {
                box-shadow: none;
                background: transparent;
            }
            thead {
                display: none; /* Hide headers in mobile */
            }
            tr {
                display: block;
                background-color: #ffffff;
                margin-bottom: 15px;
                border-radius: 10px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                padding: 10px;
            }
            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid #f0f0f0;
                padding: 10px 5px;
                text-align: right;
            }
            td:last-child {
                border-bottom: none;
            }
            /* Adding Labels to Mobile View using data-label attribute */
            td::before {
                content: attr(data-label);
                font-weight: 700;
                color: #1a73e8;
                text-align: left;
                padding-right: 10px;
                font-size: 13px;
                flex-shrink: 0;
            }
        }

        /* Desktop Controls Layout */
        @media (min-width: 600px) {
            .controls-container {
                flex-direction: row;
                align-items: center;
            }
            .input-group {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <h1>CRM Feedback 2026</h1>

    <div class="controls-container">
        <!-- Search Field -->
        <div class="input-group">
            <label for="searchInput">Search Patient</label>
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Type Name, ID, Phone...">
        </div>

        <!-- Month Dropdown -->
        <div class="input-group">
            <label for="monthSelect">Select Month</label>
            <select id="monthSelect" onchange="loadSheetData()">
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
            </select>
        </div>
    </div>

    <!-- Data Display Area -->
    <div class="table-container">
        <table id="crmTable">
            <thead>
                <tr>
                    <th>REG DATE</th>
                    <th>PATIENT ID</th>
                    <th>PATIENT NAME</th>
                    <th>PHN NO.</th>
                    <th>CALL STATUS</th>
                    <th>FEEDBACK</th>
                    <th>CALL TYPE</th>
                    <th>ASSIGNED TO</th>
                    <th>CALL DUE DATE</th>
                    <th>TASK STATUS</th>
                    <th>REMARKS</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will load here -->
            </tbody>
        </table>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwF2Z-ZPDr5vCutpqpKf_sVPTyCdPqEIIrtTWhg6qNH368W9amj1a2qC9bYpNGfHidjyw/exec"; 

        async function loadSheetData() {
            const selectedMonth = document.getElementById("monthSelect").value;
            const tableBody = document.getElementById("tableBody");
            document.getElementById("searchInput").value = ""; 
            
            tableBody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding: 20px;">Loading ${selectedMonth} data...</td></tr>`;

            try {
                const response = await fetch(`${WEB_APP_URL}?sheet=${selectedMonth}`);
                const data = await response.json();

                if (data.error || !Array.isArray(data) || data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding: 20px; color:red;">No data found for ${selectedMonth}</td></tr>`;
                    return;
                }

                tableBody.innerHTML = "";
                data.forEach(row => {
                    const tr = document.createElement("tr");
                    // Using data-label for Mobile View CSS
                    tr.innerHTML = `
                        <td data-label="REG DATE">${row["REG DATE"] || '-'}</td>
                        <td data-label="PATIENT ID">${row["PATIENT ID"] || '-'}</td>
                        <td data-label="PATIENT NAME" style="font-weight:bold;">${row["PATIENT NAME"] || '-'}</td>
                        <td data-label="PHN NO.">${row["PHN NO."] || '-'}</td>
                        <td data-label="CALL STATUS">${row["CALL STATUS"] || '-'}</td>
                        <td data-label="FEEDBACK">${row["FEEDBACK"] || '-'}</td>
                        <td data-label="CALL TYPE">${row["CALL TYPE"] || '-'}</td>
                        <td data-label="ASSIGNED TO">${row["ASSIGNED TO"] || '-'}</td>
                        <td data-label="CALL DUE DATE">${row["CALL DUE DATE"] || '-'}</td>
                        <td data-label="TASK STATUS">${row["TASK STATUS"] || '-'}</td>
                        <td data-label="REMARKS">${row["REMARKS"] || '-'}</td>
                    `;
                    tableBody.appendChild(tr);
                });

            } catch (error) {
                console.error(error);
                tableBody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding: 20px; color:red;">Error loading data. Check Web App URL.</td></tr>`;
            }
        }

        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const table = document.getElementById("crmTable");
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let showRow = false;
                const td = tr[i].getElementsByTagName("td");
                
                for (let j = 0; j < td.length; j++) {
                    if (td[j]) {
                        if (td[j].innerText.toLowerCase().indexOf(filter) > -1) {
                            showRow = true;
                            break;
                        }
                    }
                }
                tr[i].style.display = showRow ? "block" : "none"; // Kept block for mobile compatibility
                // fix for desktop search display:
                if (showRow && window.innerWidth > 768) {
                    tr[i].style.display = "table-row";
                }
            }
        }

        window.onload = loadSheetData;
        window.addEventListener('resize', filterTable); // Adjust display on window resize
    </script>

</body>
</html>
