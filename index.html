<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Patient Tracker</title>

  <!-- PWA Connections -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2b6cb0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Patient Tracker">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/17icwijGR2PT4sa7mteOgf_PozoQP3a4d">

  <!-- External Libraries for Graph, Excel, PDF Export -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f4f8; padding: 12px; color: #333; -webkit-tap-highlight-color: transparent; }
    
    .container { max-width: 100%; margin: 0 auto; }
    header { 
      background: linear-gradient(135deg, #2b6cb0, #1a365d); 
      color: white; 
      padding: 14px; 
      border-radius: 12px; 
      margin-bottom: 12px; 
      text-align: center; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; }

    .btn-refresh-top {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }
    .btn-refresh-top:active { background: rgba(255, 255, 255, 0.4); }

    .card { background: white; padding: 12px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 12px; }
    .card h3 { font-size: 0.85rem; color: #4a5568; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    .export-btns { display: flex; gap: 6px; }
    .btn-export { border: none; padding: 5px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: bold; color: white; cursor: pointer; transition: opacity 0.2s; }
    .btn-export:active { opacity: 0.8; }
    .btn-excel { background-color: #276749; }
    .btn-pdf { background-color: #c53030; }

    .report-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-bottom: 12px; }
    .report-table th, .report-table td { border: 1px solid #e2e8f0; padding: 8px 4px; text-align: center; }
    .report-table th { background-color: #edf2f7; color: #2d3748; font-weight: bold; }

    .chart-container { position: relative; width: 100%; height: 260px; margin-top: 10px; }

    .filter-box { background: white; padding: 12px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .filter-title { font-size: 0.85rem; font-weight: bold; color: #2d3748; margin-bottom: 8px; }
    
    .search-input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.85rem; margin-bottom: 8px; outline: none; }

    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { font-size: 0.7rem; font-weight: 600; color: #4a5568; display: block; margin-bottom: 2px; }
    select, input[type="date"] { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.8rem; background: #fff; outline: none; appearance: none; -webkit-appearance: none; }
    
    .btn-reset { background: #e2e8f0; border: none; padding: 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; color: #4a5568; margin-top: 8px; width: 100%; cursor: pointer; transition: background 0.2s; }
    .btn-reset:active { background: #cbd5e0; }

    /* Record Summary Counter Bar */
    .summary-counter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ebf8ff;
      border: 1px solid #bee3f8;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 0.82rem;
      color: #2b6cb0;
      font-weight: 600;
    }
    .count-badge {
      background: #2b6cb0;
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.78rem;
    }

    .data-list { display: flex; flex-direction: column; gap: 10px; }
    .data-card { background: white; border-radius: 10px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border-left: 4px solid #cbd5e0; }
    .data-card.pending { border-left-color: #e53e3e; background-color: #fff8f8; }
    .data-card.completed { border-left-color: #38a169; }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #edf2f7; padding-bottom: 4px; }
    .patient-name { font-weight: bold; font-size: 0.95rem; color: #2d3748; }
    
    .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: bold; text-transform: uppercase; }
    .badge-pending { background: #fed7d7; color: #9b2c2c; }
    .badge-completed { background: #c6f6d5; color: #22543d; }
    
    .card-body { font-size: 0.8rem; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; color: #4a5568; }
    .full-width { grid-column: span 2; }
    .remarks-box { color: #e53e3e; font-weight: 600; background: #fff; padding: 6px; border-radius: 6px; border: 1px dashed #feb2b2; margin-top: 2px; }

    .phone-link { color: #2b6cb0; text-decoration: none; font-weight: bold; }
    .loader { text-align: center; padding: 20px; font-size: 0.85rem; font-weight: bold; color: #4a5568; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Patient Call Tracker</h1>
    <button class="btn-refresh-top" onclick="loadData()">🔄 Refresh</button>
  </header>

  <!-- Performance Summary & Graph Card -->
  <div class="card">
    <div class="report-header">
      <h3 id="reportTitle" style="margin-bottom:0;">Staff Performance Report</h3>
      <div class="export-btns">
        <button class="btn-export btn-excel" onclick="exportToExcel()">📊 Excel</button>
        <button class="btn-export btn-pdf" onclick="exportToPDF()">📄 PDF</button>
      </div>
    </div>
    
    <table class="report-table" id="reportTable">
      <thead>
        <tr>
          <th>Staff Name</th>
          <th>Total Calls</th>
          <th>Completed</th>
          <th>Pending</th>
        </tr>
      </thead>
      <tbody id="staffReport">
        <tr><td colspan="4">Loading Report...</td></tr>
      </tbody>
    </table>

    <div class="chart-container">
      <canvas id="performanceChart"></canvas>
    </div>
  </div>

  <!-- Search & Filters -->
  <div class="filter-box">
    <div class="filter-title">Search & Filters</div>
    
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search Name or Phone Number..." onkeyup="applyFilters()">

    <div class="filter-grid">
      <div>
        <label>From Date</label>
        <input type="date" id="fromDate" onchange="applyFilters()">
      </div>
      <div>
        <label>To Date</label>
        <input type="date" id="toDate" onchange="applyFilters()">
      </div>

      <div>
        <label>Assigned Staff</label>
        <select id="filterStaff" onchange="applyFilters()">
          <option value="">All Staffs</option>
        </select>
      </div>

      <div>
        <label>Task Status</label>
        <select id="filterTaskStatus" onchange="applyFilters()">
          <option value="">All Status</option>
          <option value="PENDING">PENDING Only</option>
          <option value="COMPLETED">COMPLETED Only</option>
        </select>
      </div>

      <div>
        <label>Call Status</label>
        <select id="filterCallStatus" onchange="applyFilters()">
          <option value="">All Calls</option>
        </select>
      </div>

      <div>
        <label>Call Type</label>
        <select id="filterCallType" onchange="applyFilters()">
          <option value="">All Types</option>
        </select>
      </div>
    </div>
    
    <button class="btn-reset" onclick="resetFilters()">Reset All Filters</button>
  </div>

  <!-- Total Record Counter Display Bar -->
  <div class="summary-counter" id="summaryCounterBox" style="display:none;">
    <span>Showing Filtered Records:</span>
    <span class="count-badge" id="recordCountBadge">0 Records</span>
  </div>

  <div id="loader" class="loader">Loading Data...</div>
  <div class="data-list" id="patientList"></div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker Registered'))
        .catch(err => console.log('SW Registration Failed: ', err));
    });
  }

  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyuviYsO8fU0tzioTtXFZ0Iuoxh8OZkzlW3DZmjYKNFfXkBOhwwtPgxnTatyPPW8CzZQg/exec';
  let rawData = [];
  let chartInstance = null;
  let maxDateInSheet = '';

  function getVal(item, keys) {
    if (!item) return '';
    const itemKeys = Object.keys(item);
    for (let k of keys) {
      const match = itemKeys.find(ik => ik.trim().toLowerCase() === k.toLowerCase());
      if (match && item[match] !== undefined && item[match] !== null) {
        return item[match].toString().trim();
      }
    }
    return '';
  }

  function parseDateToISO(dateStr) {
    if (!dateStr) return '';
    let str = dateStr.toString().trim();
    if (!str) return '';

    if (str.includes('/') || str.includes('-')) {
      const parts = str.split(/[\/\-]/);
      if (parts.length === 3) {
        if (parts[0].length === 4) {
          return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
        } else if (parts[2].length === 4) {
          return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
        }
      }
    }
    
    const d = new Date(str);
    if (!isNaN(d.getTime())) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    return '';
  }

  function formatDateDisplay(isoStr) {
    if (!isoStr) return 'Blank Date';
    const parts = isoStr.split('-');
    if (parts.length === 3) {
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }
    return isoStr;
  }

  async function loadData() {
    const loader = document.getElementById('loader');
    loader.style.display = 'block';
    loader.innerText = 'Loading Data...';

    try {
      const response = await fetch(SCRIPT_URL);
      const data = await response.json();
      
      let allDates = [];

      rawData = data.map(item => {
        const rawDate = getVal(item, ['REG DATE', 'Reg Date', 'DATE', 'Date', 'REGISTRATION DATE']);
        let isoDate = parseDateToISO(rawDate);

        if (isoDate) {
          allDates.push(isoDate);
        }

        return {
          original: item,
          regDateISO: isoDate,
          patientName: getVal(item, ['PATIENT NAME', 'NAME', 'PATIENT']),
          patientId: getVal(item, ['PATIENT ID', 'ID', 'SL NO', 'SLNO']),
          phone: getVal(item, ['PHN NO.', 'PHN NO', 'PHONE', 'PHONE NO', 'MOBILE', 'CONTACT']),
          callStatus: getVal(item, ['CALL STATUS', 'STATUS']),
          feedback: getVal(item, ['FEEDBACK', 'FEED BACK']),
          callType: getVal(item, ['CALL TYPE', 'TYPE']),
          assignedTo: getVal(item, ['ASSIGNED TO', 'STAFF', 'ASSIGNED']),
          taskStatus: getVal(item, ['TASK STATUS', 'TASK']),
          remarks: getVal(item, ['REMARKS', 'REMARK', 'NOTE'])
        };
      });

      // Find Max Date in Sheet
      if (allDates.length > 0) {
        allDates.sort();
        maxDateInSheet = allDates[allDates.length - 1];
        document.getElementById('toDate').value = maxDateInSheet;
      }

      loader.style.display = 'none';
      document.getElementById('summaryCounterBox').style.display = 'flex';

      populateDropdowns();
      applyFilters();
    } catch (error) {
      loader.innerText = 'Data load ചെയ്യാൻ കഴിഞ്ഞില്ല. Apps Script URL ഉറപ്പുവരുത്തുക.';
    }
  }

  function populateDropdowns() {
    const staffSelect = document.getElementById('filterStaff');
    const staffs = [...new Set(
      rawData.map(d => d.assignedTo.toUpperCase())
             .filter(name => Boolean(name) && name !== 'ASSIGNED TO' && name !== 'STAFF')
    )].sort();

    staffSelect.innerHTML = '<option value="">All Staffs</option>';
    staffs.forEach(s => {
      staffSelect.innerHTML += `<option value="${s}">${s}</option>`;
    });

    const callStatusSelect = document.getElementById('filterCallStatus');
    const callStatuses = [...new Set(rawData.map(d => d.callStatus.toUpperCase()).filter(Boolean))].sort();
    callStatusSelect.innerHTML = '<option value="">All Calls</option>';
    callStatuses.forEach(cs => {
      callStatusSelect.innerHTML += `<option value="${cs}">${cs}</option>`;
    });

    const callTypeSelect = document.getElementById('filterCallType');
    const callTypes = [...new Set(rawData.map(d => d.callType.toUpperCase()).filter(Boolean))].sort();
    callTypeSelect.innerHTML = '<option value="">All Types</option>';
    callTypes.forEach(ct => {
      callTypeSelect.innerHTML += `<option value="${ct}">${ct}</option>`;
    });
  }

  function updatePerformanceReport(filteredByDateData, fromDate, toDate) {
    const reportTitle = document.getElementById('reportTitle');
    
    if (fromDate && toDate) {
      reportTitle.innerHTML = `Staff Performance Report <span style="font-size:0.75rem; color:#2b6cb0;">(${formatDateDisplay(fromDate)} to ${formatDateDisplay(toDate)})</span>`;
    } else {
      reportTitle.innerText = "Overall Staff Performance Report";
    }

    const staffs = [...new Set(
      rawData.map(d => d.assignedTo.toUpperCase())
             .filter(name => Boolean(name) && name !== 'ASSIGNED TO' && name !== 'STAFF')
    )].sort();
    
    if (staffs.length === 0) {
      document.getElementById('staffReport').innerHTML = '<tr><td colspan="4">No Staff Data Found</td></tr>';
      if (chartInstance) chartInstance.destroy();
      return;
    }

    const totalData = [];
    const completedData = [];
    const pendingData = [];

    const html = staffs.map(staff => {
      const staffData = filteredByDateData.filter(d => d.assignedTo.toUpperCase() === staff);

      const totalCalls = staffData.length;
      const completed = staffData.filter(d => d.taskStatus.toUpperCase() === 'COMPLETED').length;
      const pending = totalCalls - completed;

      totalData.push(totalCalls);
      completedData.push(completed);
      pendingData.push(pending);

      return `
        <tr>
          <td><strong>${staff}</strong></td>
          <td>${totalCalls}</td>
          <td style="color:green; font-weight:bold;">${completed}</td>
          <td style="color:red; font-weight:bold;">${pending}</td>
        </tr>
      `;
    }).join('');

    document.getElementById('staffReport').innerHTML = html;
    renderPerformanceChart(staffs, totalData, completedData, pendingData);
  }

  function renderPerformanceChart(labels, totalData, completedData, pendingData) {
    const ctx = document.getElementById('performanceChart').getContext('2d');
    
    if (chartInstance) {
      chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { label: 'Total Calls', data: totalData, backgroundColor: '#3182ce' },
          { label: 'Completed', data: completedData, backgroundColor: '#38a169' },
          { label: 'Pending', data: pendingData, backgroundColor: '#e53e3e' }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top', labels: { font: { size: 10 } } }
        },
        scales: {
          x: { ticks: { font: { size: 10 } } },
          y: { beginAtZero: true, ticks: { precision: 0 } }
        }
      }
    });
  }

  function renderCards(data) {
    const container = document.getElementById('patientList');
    container.innerHTML = '';

    // Update total count badge
    document.getElementById('recordCountBadge').innerText = `${data.length} Records`;

    if (data.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:15px; background:white; border-radius:10px; font-size:0.85rem;">ഡാറ്റയൊന്നും കണ്ടെത്തിയില്ല!</div>';
      return;
    }

    data.forEach(item => {
      const isCompleted = item.taskStatus.toUpperCase() === 'COMPLETED';
      const cardClass = isCompleted ? 'data-card completed' : 'data-card pending';
      const badgeClass = isCompleted ? 'badge badge-completed' : 'badge badge-pending';
      const displayStatus = isCompleted ? 'COMPLETED' : 'PENDING';
      const remarks = item.remarks || '-';
      const phoneNum = item.phone || '-';

      const card = document.createElement('div');
      card.className = cardClass;
      card.innerHTML = `
        <div class="card-header">
          <span class="patient-name">${item.patientName || 'N/A'}</span>
          <span class="${badgeClass}">${displayStatus}</span>
        </div>
        <div class="card-body">
          <div><strong>Reg Date:</strong> ${formatDateDisplay(item.regDateISO)}</div>
          <div><strong>ID:</strong> ${item.patientId || '-'}</div>
          <div><strong>Ph No:</strong> ${phoneNum !== '-' ? `<a href="tel:${phoneNum}" class="phone-link">${phoneNum}</a>` : '-'}</div>
          <div><strong>Call Status:</strong> ${item.callStatus || '-'}</div>
          <div><strong>Feedback:</strong> ${item.feedback || '-'}</div>
          <div><strong>Call Type:</strong> ${item.callType || '-'}</div>
          <div class="full-width"><strong>Assigned To:</strong> ${item.assignedTo || '-'}</div>
          <div class="full-width ${!isCompleted ? 'remarks-box' : ''}">
            <strong>Remarks:</strong> ${remarks}
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function applyFilters() {
    const searchVal = document.getElementById('searchInput').value.toLowerCase();
    const fromDate = document.getElementById('fromDate').value;
    const toDate = document.getElementById('toDate').value;
    const staffVal = document.getElementById('filterStaff').value.toUpperCase();
    const taskVal = document.getElementById('filterTaskStatus').value.toUpperCase();
    const callVal = document.getElementById('filterCallStatus').value.toUpperCase();
    const typeVal = document.getElementById('filterCallType').value.toUpperCase();

    const filteredByDate = rawData.filter(item => {
      if (!fromDate && !toDate) return true;
      if (!item.regDateISO) return true;

      if (fromDate && toDate) return item.regDateISO >= fromDate && item.regDateISO <= toDate;
      if (fromDate) return item.regDateISO >= fromDate;
      if (toDate) return item.regDateISO <= toDate;
      return true;
    });

    updatePerformanceReport(filteredByDate, fromDate, toDate);

    const finalFiltered = filteredByDate.filter(item => {
      const nameMatch = item.patientName.toLowerCase().includes(searchVal);
      const phoneMatch = item.phone.includes(searchVal);
      const searchMatch = !searchVal || nameMatch || phoneMatch;

      const staffMatch = !staffVal || item.assignedTo.toUpperCase() === staffVal;
      
      let taskMatch = true;
      if (taskVal === 'COMPLETED') {
        taskMatch = item.taskStatus.toUpperCase() === 'COMPLETED';
      } else if (taskVal === 'PENDING') {
        taskMatch = item.taskStatus.toUpperCase() !== 'COMPLETED';
      }

      const callMatch = !callVal || item.callStatus.toUpperCase() === callVal;
      const typeMatch = !typeVal || item.callType.toUpperCase() === typeVal;

      return searchMatch && staffMatch && taskMatch && callMatch && typeMatch;
    });

    renderCards(finalFiltered);
  }

  function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = maxDateInSheet;
    document.getElementById('filterStaff').value = '';
    document.getElementById('filterTaskStatus').value = '';
    document.getElementById('filterCallStatus').value = '';
    document.getElementById('filterCallType').value = '';
    applyFilters();
  }

  function exportToExcel() {
    const table = document.getElementById("reportTable");
    const wb = XLSX.utils.table_to_book(table, { sheet: "Staff Report" });
    XLSX.writeFile(wb, "Staff_Performance_Report.xlsx");
  }

  function exportToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(14);
    doc.text("Staff Performance Report", 14, 15);

    doc.autoTable({
      html: '#reportTable',
      startY: 22,
      theme: 'grid',
      headStyles: { fillColor: [43, 108, 176] },
      styles: { fontSize: 10, halign: 'center' }
    });

    doc.save("Staff_Performance_Report.pdf");
  }

  loadData();
</script>

</body>
</html>
