<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Feedback 2026</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            padding: 12px;
            color: #1f2937;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 12px;
            color: #1d4ed8;
            font-weight: 700;
        }
        .controls-container {
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            background-color: #f9fafb;
        }
        select:focus, input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        /* Desktop Table View */
        .table-container {
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid #f3f4f6;
            text-align: left;
            font-size: 13px;
        }
        th {
            background-color: #2563eb;
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }
        tr:nth-child(even) {
            background-color: #f9fafb;
        }

        /* Status Badges */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            width: fit-content;
        }
        .badge-success { background-color: #dcfce7; color: #15803d; }
        .badge-danger { background-color: #fee2e2; color: #b91c1c; }
        .badge-warning { background-color: #fef3c7; color: #b45309; }
        .badge-default { background-color: #e5e7eb; color: #374151; }

        /* Call Button Style */
        .call-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            width: fit-content;
        }
        .call-btn:hover {
            background-color: #1d4ed8;
        }

        /* Custom Grid Mobile Card Layout */
        @media screen and (max-width: 768px) {
            table {
                background: transparent;
                box-shadow: none;
            }
            thead {
                display: none;
            }
            tr {
                display: grid;
                grid-template-columns: repeat(6, 1fr);
                gap: 8px;
                background-color: #ffffff;
                margin-bottom: 12px;
                border-radius: 12px;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
                padding: 12px;
                border: 1px solid #e5e7eb;
            }
            td {
                display: flex;
                flex-direction: column;
                justify-content: center;
                border-bottom: none;
                padding: 4px;
                text-align: left;
                font-size: 13px;
                word-break: break-word;
            }

            /* Row Configurations */
            td[data-label="REG DATE"],
            td[data-label="PATIENT ID"],
            td[data-label="CALL STATUS"] {
                grid-column: span 2;
            }

            td[data-label="PATIENT NAME"] {
                grid-column: span 3;
                background-color: #f9fafb;
                padding: 6px;
                border-radius: 6px;
            }
            td[data-label="PHN NO."] {
                grid-column: span 3;
                background-color: #f9fafb;
                padding: 6px;
                border-radius: 6px;
            }

            td[data-label="CALL TYPE"],
            td[data-label="FEEDBACK"],
            td[data-label="ASSIGNED TO"] {
                grid-column: span 2;
            }

            td[data-label="CALL DUE DATE"],
            td[data-label="TASK STATUS"] {
                grid-column: span 3;
            }

            td[data-label="REMARKS"] {
                grid-column: span 6;
                background-color: #f9fafb;
                padding: 8px;
                border-radius: 6px;
            }

            td::before {
                content: attr(data-label);
                font-weight: 700;
                color: #2563eb;
                font-size: 10px;
                text-transform: uppercase;
                margin-bottom: 2px;
                letter-spacing: 0.5px;
            }
        }

        @media (min-width: 600px) {
            .controls-container {
                flex-direction: row;
                align-items: center;
            }
            .input-group {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <h1>CRM Feedback 2026</h1>

    <div class="controls-container">
        <div class="input-group">
            <label for="searchInput">Search Data</label>
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Type Name, ID, Phone...">
        </div>

        <div class="input-group">
            <label for="monthSelect">Select Month</label>
            <select id="monthSelect" onchange="loadSheetData()">
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table id="crmTable">
            <thead>
                <tr>
                    <th>REG DATE</th>
                    <th>PATIENT ID</th>
                    <th>PATIENT NAME</th>
                    <th>PHN NO.</th>
                    <th>CALL STATUS</th>
                    <th>CALL TYPE</th>
                    <th>FEEDBACK</th>
                    <th>ASSIGNED TO</th>
                    <th>CALL DUE DATE</th>
                    <th>TASK STATUS</th>
                    <th>REMARKS</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwF2Z-ZPDr5vCutpqpKf_sVPTyCdPqEIIrtTWhg6qNH368W9amj1a2qC9bYpNGfHidjyw/exec"; 

        async function loadSheetData() {
            const selectedMonth = document.getElementById("monthSelect").value;
            const tableBody = document.getElementById("tableBody");
            document.getElementById("searchInput").value = ""; 
            
            tableBody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding: 20px;">Loading ${selectedMonth} data...</td></tr>`;

            try {
                const response = await fetch(`${WEB_APP_URL}?sheet=${selectedMonth}`);
                const data = await response.json();

                if (data.error || !Array.isArray(data) || data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding: 20px; color:#ef4444;">No data found for ${selectedMonth}</td></tr>`;
                    return;
                }

                tableBody.innerHTML = "";
                data.forEach(row => {
                    const tr = document.createElement("tr");

                    const callStatusBadge = getBadgeHTML(row["CALL STATUS"]);
                    const taskStatusBadge = getBadgeHTML(row["TASK STATUS"]);
                    const feedbackWithEmoji = getFeedbackEmoji(row["FEEDBACK"]);

                    const phone = row["PHN NO."] || '';
                    const phoneHTML = phone ? `<a href="tel:${phone}" class="call-btn">📞 ${phone}</a>` : '-';

                    tr.innerHTML = `
                        <td data-label="REG DATE">${row["REG DATE"] || '-'}</td>
                        <td data-label="PATIENT ID">${row["PATIENT ID"] || '-'}</td>
                        <td data-label="CALL STATUS">${callStatusBadge}</td>

                        <td data-label="PATIENT NAME" style="font-weight:700; color:#111827;">${row["PATIENT NAME"] || '-'}</td>
                        <td data-label="PHN NO.">${phoneHTML}</td>

                        <td data-label="CALL TYPE">${row["CALL TYPE"] || '-'}</td>
                        <td data-label="FEEDBACK">${feedbackWithEmoji}</td>
                        <td data-label="ASSIGNED TO">${row["ASSIGNED TO"] || '-'}</td>

                        <td data-label="CALL DUE DATE">${row["CALL DUE DATE"] || '-'}</td>
                        <td data-label="TASK STATUS">${taskStatusBadge}</td>

                        <td data-label="REMARKS">${row["REMARKS"] || '-'}</td>
                    `;
                    tableBody.appendChild(tr);
                });

                filterTable();

            } catch (error) {
                console.error(error);
                tableBody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding: 20px; color:#ef4444;">Error loading data. Check Web App URL.</td></tr>`;
            }
        }

        // Emoji mapping function for Feedback
        function getFeedbackEmoji(text) {
            if (!text) return '-';
            const feedback = text.toString().trim().toLowerCase();

            if (feedback.includes("excellent")) {
                return `🤩 ${text}`;
            } else if (feedback.includes("good")) {
                return `😊 ${text}`;
            } else if (feedback.includes("average")) {
                return `😐 ${text}`;
            } else if (feedback.includes("bad")) {
                return `😡 ${text}`;
            } else {
                return text;
            }
        }

        function getBadgeHTML(statusText) {
            if (!statusText) return '-';
            const status = statusText.toString().trim().toLowerCase();
            
            if (status.includes("completed") || status.includes("closed") || status.includes("done")) {
                return `<span class="badge badge-success">${statusText}</span>`;
            } else if (status.includes("pending") || status.includes("open") || status.includes("failed")) {
                return `<span class="badge badge-danger">${statusText}</span>`;
            } else if (status.includes("progress") || status.includes("follow") || status.includes("due")) {
                return `<span class="badge badge-warning">${statusText}</span>`;
            } else {
                return `<span class="badge badge-default">${statusText}</span>`;
            }
        }

        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const table = document.getElementById("crmTable");
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let showRow = false;
                const td = tr[i].getElementsByTagName("td");
                
                for (let j = 0; j < td.length; j++) {
                    if (td[j]) {
                        if (td[j].innerText.toLowerCase().indexOf(filter) > -1) {
                            showRow = true;
                            break;
                        }
                    }
                }

                if (showRow) {
                    tr[i].style.display = window.innerWidth <= 768 ? "grid" : "table-row";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }

        window.onload = loadSheetData;
        window.addEventListener('resize', filterTable);
    </script>

</body>
</html>
