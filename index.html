<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Patient Tracker</title>

  <!-- PWA Connections -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2b6cb0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Patient Tracker">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/17icwijGR2PT4sa7mteOgf_PozoQP3a4d">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f4f8; padding: 12px; color: #333; -webkit-tap-highlight-color: transparent; }
    
    .container { max-width: 100%; margin: 0 auto; }
    header { background: linear-gradient(135deg, #2b6cb0, #1a365d); color: white; padding: 14px; border-radius: 12px; margin-bottom: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; }

    .card { background: white; padding: 12px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 12px; }
    .card h3 { font-size: 0.85rem; color: #4a5568; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .report-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .report-table th, .report-table td { border: 1px solid #e2e8f0; padding: 8px 4px; text-align: center; }
    .report-table th { background-color: #edf2f7; color: #2d3748; font-weight: bold; }

    .filter-box { background: white; padding: 12px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .filter-title { font-size: 0.85rem; font-weight: bold; color: #2d3748; margin-bottom: 8px; }
    
    /* Search Box Input */
    .search-input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.85rem; margin-bottom: 8px; outline: none; }

    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { font-size: 0.7rem; font-weight: 600; color: #4a5568; display: block; margin-bottom: 2px; }
    select, input[type="date"] { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.8rem; background: #fff; outline: none; appearance: none; -webkit-appearance: none; }
    
    .btn-reset { background: #e2e8f0; border: none; padding: 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; color: #4a5568; margin-top: 8px; width: 100%; cursor: pointer; transition: background 0.2s; }
    .btn-reset:active { background: #cbd5e0; }

    .data-list { display: flex; flex-direction: column; gap: 10px; }
    .data-card { background: white; border-radius: 10px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border-left: 4px solid #cbd5e0; }
    .data-card.pending { border-left-color: #e53e3e; background-color: #fff8f8; }
    .data-card.completed { border-left-color: #38a169; }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #edf2f7; padding-bottom: 4px; }
    .patient-name { font-weight: bold; font-size: 0.95rem; color: #2d3748; }
    
    .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: bold; text-transform: uppercase; }
    .badge-pending { background: #fed7d7; color: #9b2c2c; }
    .badge-completed { background: #c6f6d5; color: #22543d; }
    
    .card-body { font-size: 0.8rem; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; color: #4a5568; }
    .full-width { grid-column: span 2; }
    .remarks-box { color: #e53e3e; font-weight: 600; background: #fff; padding: 6px; border-radius: 6px; border: 1px dashed #feb2b2; margin-top: 2px; }

    .phone-link { color: #2b6cb0; text-decoration: none; font-weight: bold; }
    .loader { text-align: center; padding: 20px; font-size: 0.85rem; font-weight: bold; color: #4a5568; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Patient Call Tracker</h1>
  </header>

  <!-- Performance Summary Card -->
  <div class="card">
    <h3 id="reportTitle">Staff Performance Report</h3>
    <table class="report-table">
      <thead>
        <tr>
          <th>Staff Name</th>
          <th>Total Calls</th>
          <th>Completed</th>
          <th>Pending</th>
        </tr>
      </thead>
      <tbody id="staffReport">
        <tr><td colspan="4">Loading Report...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Search & Filters -->
  <div class="filter-box">
    <div class="filter-title">Search & Filters</div>
    
    <!-- Quick Search Input -->
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search Name or Phone Number..." onkeyup="applyFilters()">

    <div class="filter-grid">
      <div>
        <label>From Date</label>
        <input type="date" id="fromDate" onchange="applyFilters()">
      </div>
      <div>
        <label>To Date</label>
        <input type="date" id="toDate" onchange="applyFilters()">
      </div>

      <div>
        <label>Assigned Staff</label>
        <select id="filterStaff" onchange="applyFilters()">
          <option value="">All Staffs</option>
        </select>
      </div>

      <div>
        <label>Task Status</label>
        <select id="filterTaskStatus" onchange="applyFilters()">
          <option value="">All Status</option>
          <option value="PENDING">PENDING Only</option>
          <option value="COMPLETED">COMPLETED Only</option>
        </select>
      </div>

      <div>
        <label>Call Status</label>
        <select id="filterCallStatus" onchange="applyFilters()">
          <option value="">All Calls</option>
          <option value="CONNECTED">CONNECTED</option>
          <option value="BUSY">BUSY</option>
          <option value="NOT CONNECTED">NOT CONNECTED</option>
          <option value="NOREACHABLE">NOREACHABLE</option>
        </select>
      </div>

      <div>
        <label>Call Type</label>
        <select id="filterCallType" onchange="applyFilters()">
          <option value="">All Types</option>
          <option value="FEEDBACK">FEEDBACK</option>
          <option value="FOLLOW UP">FOLLOW UP</option>
          <option value="RETINA">RETINA</option>
          <option value="CATARACT">CATARACT</option>
        </select>
      </div>
    </div>
    
    <button class="btn-reset" onclick="resetFilters()">Reset All Filters</button>
  </div>

  <div id="loader" class="loader">Loading Data...</div>
  <div class="data-list" id="patientList"></div>
</div>

<script>
  // Service Worker Registration for PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker Registered'))
        .catch(err => console.log('SW Registration Failed: ', err));
    });
  }

  // നിങ്ങളുടെ Apps Script Web App URL ഇവിടെ നൽകുക
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxxYnwMk8SBZPcN5M86xFtME-zRbTGwiAc373SgmhDMlIwZRTKVrw6oEfFJJOTvnnHOvA/exec';
  let rawData = [];

  function getLocalDateString(dateObj = new Date()) {
    const year = dateObj.getFullYear();
    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
    const day = String(dateObj.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function setDefaultTodayDates() {
    const today = getLocalDateString();
    document.getElementById('fromDate').value = today;
    document.getElementById('toDate').value = today;
  }

  async function loadData() {
    try {
      const response = await fetch(SCRIPT_URL);
      const data = await response.json();
      
      // Blank Date ആണെങ്കിൽ തൊട്ടുമുകളിലെ തീയതി Auto ആയി എടുക്കുന്ന ലോജിക്
      let lastValidDate = '';
      rawData = data.map(item => {
        let currentDate = item['REG DATE'] || item['Reg Date'] || item['DATE'] || item['Date'];
        if (currentDate && currentDate.toString().trim() !== '') {
          lastValidDate = currentDate;
        } else {
          currentDate = lastValidDate;
        }
        return {
          ...item,
          'REG DATE': currentDate
        };
      });

      document.getElementById('loader').style.display = 'none';

      populateStaffDropdown(rawData);
      setDefaultTodayDates();
      applyFilters();
    } catch (error) {
      document.getElementById('loader').innerText = 'Data load ചെയ്യാൻ കഴിഞ്ഞില്ല. Apps Script URL ഉറപ്പുവരുത്തുക.';
    }
  }

  function populateStaffDropdown(data) {
    const staffSelect = document.getElementById('filterStaff');
    const staffs = [...new Set(data.map(item => (item['ASSIGNED TO'] || '').toString().trim().toUpperCase()).filter(Boolean))];

    staffSelect.innerHTML = '<option value="">All Staffs</option>';
    staffs.forEach(staff => {
      const option = document.createElement('option');
      option.value = staff;
      option.textContent = staff;
      staffSelect.appendChild(option);
    });
  }

  function updatePerformanceReport(filteredByDateData, fromDate, toDate) {
    const reportTitle = document.getElementById('reportTitle');
    
    if (fromDate && toDate && fromDate === toDate) {
      reportTitle.innerHTML = `Today Staff Performance Report <span style="font-size:0.75rem; color:#2b6cb0;">(${formatDate(fromDate)})</span>`;
    } else if (fromDate && toDate) {
      reportTitle.innerHTML = `Staff Performance Report <span style="font-size:0.75rem; color:#2b6cb0;">(${formatDate(fromDate)} to ${formatDate(toDate)})</span>`;
    } else {
      reportTitle.innerText = "Overall Staff Performance Report";
    }

    const staffs = [...new Set(rawData.map(item => (item['ASSIGNED TO'] || '').toString().trim().toUpperCase()).filter(Boolean))];
    
    if (staffs.length === 0) {
      document.getElementById('staffReport').innerHTML = '<tr><td colspan="4">No Staff Data Found</td></tr>';
      return;
    }

    const html = staffs.map(staff => {
      const staffData = filteredByDateData.filter(d => (d['ASSIGNED TO'] || '').toString().trim().toUpperCase() === staff);

      const totalCalls = staffData.length;
      const completed = staffData.filter(d => (d['TASK STATUS'] || '').toString().trim().toUpperCase() === 'COMPLETED').length;
      
      // Total - Completed = Pending ലോജിക് (ഡാറ്റ എൻട്രി വിട്ടുപോയാലും കണക്ക് കൃത്യമാക്കും)
      const pending = totalCalls - completed;

      return `
        <tr>
          <td><strong>${staff}</strong></td>
          <td>${totalCalls}</td>
          <td style="color:green; font-weight:bold;">${completed}</td>
          <td style="color:red; font-weight:bold;">${pending}</td>
        </tr>
      `;
    }).join('');

    document.getElementById('staffReport').innerHTML = html;
  }

  function renderCards(data) {
    const container = document.getElementById('patientList');
    container.innerHTML = '';

    if (data.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:15px; background:white; border-radius:10px; font-size:0.85rem;">ഡാറ്റയൊന്നും കണ്ടെത്തിയില്ല!</div>';
      return;
    }

    data.forEach(item => {
      const taskStatus = (item['TASK STATUS'] || '').toString().trim().toUpperCase();
      const isCompleted = taskStatus === 'COMPLETED';
      const cardClass = isCompleted ? 'data-card completed' : 'data-card pending';
      const badgeClass = isCompleted ? 'badge badge-completed' : 'badge badge-pending';
      const displayStatus = isCompleted ? 'COMPLETED' : 'PENDING';
      const remarks = item['REMARKS'] || item['Remarks'] || '-';
      const phoneNum = item['PHN NO.'] || '-';

      const card = document.createElement('div');
      card.className = cardClass;
      card.innerHTML = `
        <div class="card-header">
          <span class="patient-name">${item['PATIENT NAME'] || 'N/A'}</span>
          <span class="${badgeClass}">${displayStatus}</span>
        </div>
        <div class="card-body">
          <div><strong>Reg Date:</strong> ${formatDate(item['REG DATE'])}</div>
          <div><strong>ID:</strong> ${item['PATIENT ID'] || '-'}</div>
          <div><strong>Ph No:</strong> ${phoneNum !== '-' ? `<a href="tel:${phoneNum}" class="phone-link">${phoneNum}</a>` : '-'}</div>
          <div><strong>Call Status:</strong> ${item['CALL STATUS'] || '-'}</div>
          <div><strong>Feedback:</strong> ${item['FEEDBACK'] || '-'}</div>
          <div><strong>Call Type:</strong> ${item['CALL TYPE'] || '-'}</div>
          <div class="full-width"><strong>Assigned To:</strong> ${item['ASSIGNED TO'] || '-'}</div>
          <div class="full-width ${!isCompleted ? 'remarks-box' : ''}">
            <strong>Remarks:</strong> ${remarks}
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function applyFilters() {
    const searchVal = document.getElementById('searchInput').value.toLowerCase();
    const fromDate = document.getElementById('fromDate').value;
    const toDate = document.getElementById('toDate').value;
    const staffVal = document.getElementById('filterStaff').value.toUpperCase();
    const taskVal = document.getElementById('filterTaskStatus').value.toUpperCase();
    const callVal = document.getElementById('filterCallStatus').value.toUpperCase();
    const typeVal = document.getElementById('filterCallType').value.toUpperCase();

    const filteredByDate = rawData.filter(item => {
      const itemDate = getISOFromDate(item['REG DATE']);
      let dateMatch = true;
      if (fromDate && toDate) {
        dateMatch = itemDate >= fromDate && itemDate <= toDate;
      } else if (fromDate) {
        dateMatch = itemDate >= fromDate;
      } else if (toDate) {
        dateMatch = itemDate <= toDate;
      }
      return dateMatch;
    });

    updatePerformanceReport(filteredByDate, fromDate, toDate);

    const finalFiltered = filteredByDate.filter(item => {
      const nameMatch = (item['PATIENT NAME'] || '').toString().toLowerCase().includes(searchVal);
      const phoneMatch = (item['PHN NO.'] || '').toString().includes(searchVal);
      const searchMatch = !searchVal || nameMatch || phoneMatch;

      const staffMatch = !staffVal || (item['ASSIGNED TO'] || '').toString().trim().toUpperCase() === staffVal;
      
      const itemTaskStatus = (item['TASK STATUS'] || '').toString().trim().toUpperCase();
      let taskMatch = true;
      if (taskVal === 'COMPLETED') {
        taskMatch = itemTaskStatus === 'COMPLETED';
      } else if (taskVal === 'PENDING') {
        taskMatch = itemTaskStatus !== 'COMPLETED';
      }

      const callMatch = !callVal || (item['CALL STATUS'] || '').toString().trim().toUpperCase() === callVal;
      const typeMatch = !typeVal || (item['CALL TYPE'] || '').toString().trim().toUpperCase() === typeVal;

      return searchMatch && staffMatch && taskMatch && callMatch && typeMatch;
    });

    renderCards(finalFiltered);
  }

  function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('filterStaff').value = '';
    document.getElementById('filterTaskStatus').value = '';
    document.getElementById('filterCallStatus').value = '';
    document.getElementById('filterCallType').value = '';
    setDefaultTodayDates();
    applyFilters();
  }

  function getISOFromDate(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    if (isNaN(date.getTime())) return '';
    return getLocalDateString(date);
  }

  function formatDate(dateStr) {
    const iso = getISOFromDate(dateStr);
    if (!iso) return dateStr || '-';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  loadData();
</script>

</body>
</html>
